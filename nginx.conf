# =====================================================
# Statix — nginx (SPA de Vite/React)
# =====================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        font/woff2;

    # Assets con hash en el nombre → caché agresiva e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index nunca se cachea (siempre apunta a los assets más recientes)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: cualquier ruta (p. ej. /binomial, /normal) sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
